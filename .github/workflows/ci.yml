name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc: gcc-11
            fc: gfortran-11
          - cc: gcc-12
            fc: gfortran-12
          - cc: gcc-13
            fc: gfortran-13
          - cc: gcc-14
            fc: gfortran-14
          - cc: clang
            fc: gfortran
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            ${{ matrix.compiler.cc }} \
            ${{ matrix.compiler.fc }} \
            libopenblas-dev
      
      - name: Generate configure script
        run: ./autogen.sh
      
      - name: Configure (CPU-only version)
        run: |
          ./configure \
            CC=${{ matrix.compiler.cc }} \
            FC=${{ matrix.compiler.fc }} \
            --disable-nvidia \
            --disable-amd
      
      - name: Build
        run: make -j$(nproc)
      
      - name: Run tests
        run: make check
      
      - name: Display test results on failure
        if: failure()
        run: |
          if [ -f tests/test-suite.log ]; then
            echo "=== Test Suite Log ==="
            cat tests/test-suite.log
          fi
          for log in tests/*.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done

  # macOS arm64: builds against the system Accelerate framework. This is the
  # platform where the Fortran-ABI sdot_ entry point is broken (returns 0.0),
  # so this job verifies the cblas_sdot probe/fallback in gpu_sdot.
  build-and-test-macos:
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: ci-macos-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate configure script
        run: ./autogen.sh

      - name: Configure (CPU-only version, system Accelerate BLAS)
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          ./configure --disable-nvidia --disable-amd

      - name: Build
        run: make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: make check

      - name: Display test results on failure
        if: failure()
        run: |
          if [ -f tests/test-suite.log ]; then
            echo "=== Test Suite Log ==="
            cat tests/test-suite.log
          fi
          for log in tests/*.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done
